name: Verificacoes de codigo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Verificar sintaxe
        run: python -m compileall -q app.py faeg_app database views tests
      - name: Testes unitarios e verificacoes de modularizacao (SQLite isolado)
        run: python -m pytest -q tests
        env:
          DATABASE_URL: 'sqlite:///:memory:'
